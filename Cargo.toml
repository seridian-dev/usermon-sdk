[workspace]
members = ["crates/core", "crates/cli"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Usermon"]
homepage = "https://github.com/usermon/usermon-sdk"
repository = "https://github.com/usermon/usermon-sdk"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
