# Local quality gates (no GitHub Actions). Installed by `bun install` (prepare script in package.json).
# Rust workspace: lefthook is used only as the hook runner, so the commands are cargo.
pre-commit:
  commands:
    fmt:
      glob: "*.rs"
      run: cargo fmt --all --check

pre-push:
  commands:
    test:
      run: cargo test --workspace
