[package]
name = "usermon-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Usermon CLI — send sessions, spans, exceptions, and logs from the terminal"

[[bin]]
name = "usermon"
path = "src/main.rs"

[dependencies]
usermon-core = { path = "../core" }
clap = { version = "4", features = ["derive", "env", "color"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
colored = "2"
dirs = "5"
